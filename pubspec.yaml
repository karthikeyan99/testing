name: sales_tracker
description: Track Flipkart and Amazon seller sales, fees, GST tax, inventory and profit.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3        # desktop (Windows/Linux/macOS)
  sqflite_common_ffi_web: ^0.4.5+1  # web (Chrome/Edge)
  path: ^1.9.0
  path_provider: ^2.1.4

  # CSV import / export
  csv: ^6.0.0
  file_picker: ^8.0.6
  share_plus: ^12.0.0   # >=10 uses web ^1.0, compatible with sqflite ffi web

  # Charts
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
